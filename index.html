<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dead End</title>
    <meta name="description" content="Shamus rebuilt in 3D: a robot detective, 128 electrified rooms, colored keys, robots that respawn, and the Shadow if you linger." />
    <meta name="theme-color" content="#07080c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 12.2c2.6-1.1 15.4-1.1 18 0l-.6 1.6c-3-.9-13.8-.9-16.8 0z' fill='%23e2ad62'/%3E%3Cpath d='M7 12 8.2 5.2c.2-.9 1-1.4 1.8-1.1l2 .7 2-.7c.8-.3 1.6.2 1.8 1.1L17 12z' fill='%23c98a3c'/%3E%3Crect x='7.2' y='13.6' width='9.6' height='7.6' rx='3' fill='%23e9e3d6'/%3E%3Crect x='8.4' y='15.6' width='7.2' height='2.4' rx='1.2' fill='%2312151c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view" class="view" role="img" aria-label="Dead End: the current room of the Shadow's lair, seen from above"></canvas>
    <div id="hud" hidden></div>
    <div id="touch" class="touch" hidden></div>
    <div id="ui" class="ui" hidden></div>
    <div id="boot" class="boot" role="status">Loading the lair…</div>
    <noscript>
      <div class="noscript">
        <h1>Dead End</h1>
        <p>Dead End is a game that runs in your browser, and it needs JavaScript turned on.</p>
        <p><a href="../">Back to the arcade</a></p>
      </div>
    </noscript>
    <script>
      // If the game's modules never start (a missing file, a very old browser), say so.
      setTimeout(function () {
        if (!window.__deadEndBooted) {
          var b = document.getElementById('boot');
          if (b) b.textContent = 'Dead End could not start in this browser. Try reloading the page.';
        }
      }, 12000);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
